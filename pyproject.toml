[project]
name = "vllm-sampling-fidelity"
version = "0.1.0"
description = "Controlled vLLM next-token sampling fidelity experiment"
requires-python = "==3.11.*"
dependencies = [
    "vllm==0.11.0",
    "transformers==4.57.1",
    "numpy==2.2.6",
    "scipy==1.16.2",
    "PyYAML==6.0.2",
    "matplotlib==3.10.7",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]